name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (fallback for platforms without prior release)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Install build tools (macOS fallback)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja
      - name: Install build tools (Windows fallback)
        if: matrix.os == 'windows-latest'
        run: |
          choco install ninja -y
          echo "C:\Program Files\Ninja" >> $env:GITHUB_PATH
      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Package Release (using previous Cippie release)
        shell: bash
        run: |
          ./scripts/package-release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES_FILE="docs/RELEASE_NOTES_${VERSION//./_}.md"

          echo "Creating release for tag ${TAG}..."

          if [ -f "${NOTES_FILE}" ]; then
            echo "Using release notes from ${NOTES_FILE}"
            gh release create "${TAG}" \
              --title "Cippie ${TAG}" \
              --notes-file "${NOTES_FILE}" \
              dist/*.tar.gz dist/*.sha256
          else
            echo "Warning: ${NOTES_FILE} not found, generating notes from changelog"
            gh release create "${TAG}" \
              --title "Cippie ${TAG}" \
              --generate-notes \
              dist/*.tar.gz dist/*.sha256
          fi
